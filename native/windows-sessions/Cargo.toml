[package]
name = "stela-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation", "Wdk_Storage_FileSystem",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemServices",
] }
